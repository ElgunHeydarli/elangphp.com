# Host-specific include: nginx.ssl.conf_securitytxt on the official Hestia domain.
# Keep the disclosure contact refreshable instead of inheriting the static-asset cache.
location = /.well-known/security.txt {
    root /home/ecommerce/web/elangphp.com/public_html;
    default_type text/plain;
    charset utf-8;
    expires 1h;
    try_files $uri =404;
}

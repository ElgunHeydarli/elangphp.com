name: elang-dev
x-runtime: &runtime
  build:
    context: .
    dockerfile: devkit/Dockerfile
  working_dir: /app
  volumes:
    - .:/app
    - composer-vendor:/app/vendor
    - runtime-storage:/app/storage
  environment: &environment
    APP_ENV: local
    APP_DEBUG: 'false'
    APP_KEY_FILE: /app/storage/dev/app.key
    APP_URL: http://localhost:8000
    DATABASE_URL: postgresql://elang:development-only@postgres:5432/elang_dev
    REDIS_URL: redis://redis:6379/0
    MAILER_DSN: smtp://mailpit:1025
    MAIL_FROM: developer@example.test
    OPERATIONS_ENABLED: 'true'
    OTEL_ENABLED: 'true'
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    FILES_DISK: s3
    S3_BUCKET: elang-dev
    S3_REGION: us-east-1
    S3_ENDPOINT: http://seaweed:8333
    S3_PATH_STYLE: 'true'
    S3_KEY: development-only
    S3_SECRET: development-only-secret
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    seaweed: { condition: service_started }
    mailpit: { condition: service_started }
    otel-collector: { condition: service_started }
services:
  app:
    <<: *runtime
    environment:
      <<: *environment
      ELANG_DEV_SETUP: 'true'
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
  queue:
    <<: *runtime
    command: ['php', 'elang', 'queue:work']
    profiles: [workers]
    depends_on:
      app: { condition: service_healthy }
  outbox:
    <<: *runtime
    command: ['php', 'elang', 'outbox:work']
    profiles: [workers]
    depends_on:
      app: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elang
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: elang_dev
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elang -d elang_dev']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  seaweed:
    image: docker.io/chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command: ['server', '-dir=/data', '-ip=seaweed', '-ip.bind=0.0.0.0', '-master.peers=none', '-master.volumeSizeLimitMB=64', '-master.volumePreallocate=false', '-master.telemetry=false', '-volume.max=8', '-filer', '-s3', '-s3.port=8333', '-s3.port.iceberg=0', '-s3.port.lance=0', '-s3.config=/etc/seaweed-s3.json']
    volumes: ['objects:/data', './devkit/seaweed-s3.json:/etc/seaweed-s3.json:ro']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025']
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./devkit/otel-collector.yaml:/etc/otelcol/config.yaml:ro']
volumes:
  composer-vendor:
  runtime-storage:
  postgres-data:
  redis-data:
  objects:

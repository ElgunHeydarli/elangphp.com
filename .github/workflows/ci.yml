name: Framework checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      ELANG_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, sodium, pdo_sqlite, zip, gd, curl, fileinfo
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer test
      - run: composer analyse
      - run: composer audit
  databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, postgres]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: elang_test_ci
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pintegration-only" --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: elang_test_ci
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, sodium, pdo_sqlite, pdo_mysql, pdo_pgsql, zip, pcntl, posix
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: MySQL runtime and competing workers
        if: matrix.database == 'mysql'
        env:
          ELANG_TEST_DATABASE_URL: mysql://root:integration-only@127.0.0.1:3306/elang_test_ci?charset=utf8mb4
        run: vendor/bin/phpunit --group database-integration
      - name: PostgreSQL runtime and competing workers
        if: matrix.database == 'postgres'
        env:
          ELANG_TEST_DATABASE_URL: postgresql://postgres:integration-only@127.0.0.1:5432/elang_test_ci
        run: vendor/bin/phpunit --group database-integration

  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [lowest, latest]
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, sodium, pdo_sqlite, zip, gd, curl, fileinfo
          coverage: none
          tools: composer:v2
      - name: Resolve lowest allowed versions
        if: matrix.resolution == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
      - name: Resolve current allowed versions
        if: matrix.resolution == 'latest'
        run: composer update --no-interaction --no-progress
      - run: composer test
      - run: composer analyse
      - run: composer audit
  frontends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: [react, next]
    defaults:
      run:
        working-directory: examples/frontend-${{ matrix.frontend }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/frontend-${{ matrix.frontend }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - if: matrix.frontend == 'next'
        run: npm run test:proxy
  development-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 300 app
      - run: docker compose exec -T app php elang doctor --json
      - name: Test actual S3-compatible storage
        run: docker compose exec -T -e ELANG_TEST_S3_CONFIG=/app/devkit/seaweed-s3.json -e ELANG_TEST_S3_ENDPOINT=http://seaweed:8333 app vendor/bin/phpunit --group s3-integration
      - if: always()
        run: docker compose logs --tail=80 app seaweed
      - if: always()
        run: docker compose down --volumes
